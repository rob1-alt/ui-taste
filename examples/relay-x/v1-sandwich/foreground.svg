<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="none">
  <!-- Placeholder foreground: a lavender field (Grasse, Provence) that grows over the product window. Replace with a cut-out photograph (scripts/backdrop.py foreground). -->
  <defs>
    <clipPath id="field">
      <path d="M0 6 C90 14 170 58 280 84 C380 106 450 78 560 92 C660 104 740 140 850 134 C960 128 1010 100 1120 92 C1230 84 1300 46 1420 26 C1500 14 1560 6 1600 4 L1600 720 L0 720 Z"/>
    </clipPath>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7a36c"/><stop offset="0.5" stop-color="#737846"/><stop offset="1" stop-color="#454a2c"/>
    </linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4a2d6"/><stop offset="0.3" stop-color="#8e74bd"/><stop offset="0.7" stop-color="#5d468f"/><stop offset="1" stop-color="#3a2a5e"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#140c20" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9b0" stop-opacity="0.18"/><stop offset="0.5" stop-color="#ffd9b0" stop-opacity="0"/><stop offset="1" stop-color="#ffd9b0" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="bush" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="edge" x="-2%" y="-20%" width="104%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.12" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="tex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.2" numOctaves="2" seed="9"/>
      <feColorMatrix values="0 0 0 0 0.15  0 0 0 0 0.08  0 0 0 0 0.25  0 0 0 0.22 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#edge)">
    <g clip-path="url(#field)">
      <rect width="1600" height="720" fill="url(#soil)"/>
      <!-- rows converge to a vanishing point above the horizon -->
      <g filter="url(#bush)" stroke="url(#lav)" stroke-linecap="round" fill="none">
        <path stroke-width="59" d="M800 -260 L-2200 640"/>
        <path stroke-width="70" d="M800 -260 L-1640 640"/>
        <path stroke-width="80" d="M800 -260 L-1100 640"/>
        <path stroke-width="91" d="M800 -260 L-600 640"/>
        <path stroke-width="101" d="M800 -260 L-140 640"/>
        <path stroke-width="108" d="M800 -260 L300 640"/>
        <path stroke-width="115" d="M800 -260 L720 640"/>
        <path stroke-width="115" d="M800 -260 L1140 640"/>
        <path stroke-width="108" d="M800 -260 L1580 640"/>
        <path stroke-width="101" d="M800 -260 L2040 640"/>
        <path stroke-width="91" d="M800 -260 L2520 640"/>
        <path stroke-width="80" d="M800 -260 L3040 640"/>
        <path stroke-width="70" d="M800 -260 L3600 640"/>
      </g>
      <rect width="1600" height="600" fill="url(#lav)" opacity="0.18"/>
      <rect width="1600" height="600" fill="url(#light)"/>
      <rect width="1600" height="600" fill="url(#dark)"/>
    </g>
  </g>
  <rect width="1600" height="600" fill="#000" filter="url(#tex)" clip-path="url(#field)" opacity="0.7"/>
</svg>
