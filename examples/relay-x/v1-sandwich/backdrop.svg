<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Placeholder scene: warm late-afternoon sky over the hills of Provence. Replace with a real photograph. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c7a6"/>
      <stop offset="0.3" stop-color="#f3d9bf"/>
      <stop offset="0.58" stop-color="#fbe9d6"/>
      <stop offset="0.75" stop-color="#fff3e6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.62" r="0.4">
      <stop offset="0" stop-color="#fff8ee" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff8ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdb8c4"/><stop offset="1" stop-color="#e6d6d6"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ad98b0"/><stop offset="1" stop-color="#cbb9c0"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d8a8a"/><stop offset="1" stop-color="#a7a294"/></linearGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.03" numOctaves="4" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="haze"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="cloud" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0.05 0"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <g filter="url(#cloud)" fill="#fff6ec" opacity="0.7">
    <ellipse cx="300" cy="180" rx="260" ry="34"/>
    <ellipse cx="1260" cy="130" rx="300" ry="28"/>
    <ellipse cx="900" cy="250" rx="200" ry="20"/>
  </g>
  <!-- far hills, mauve haze -->
  <g filter="url(#haze)">
    <path filter="url(#rough)" fill="url(#h1)" d="M0 560 C120 520 220 470 340 480 C460 490 520 540 640 548 C760 556 860 520 980 530 C1120 542 1200 488 1330 470 C1450 455 1530 490 1600 505 L1600 1000 L0 1000 Z"/>
  </g>
  <path filter="url(#rough)" fill="url(#h2)" d="M0 610 C90 575 170 540 260 552 C360 566 420 612 520 620 C600 626 680 600 760 606 C860 614 940 640 1040 628 C1150 615 1240 570 1350 566 C1460 562 1540 590 1600 600 L1600 1000 L0 1000 Z"/>
  <!-- a line of cypresses on the right ridge -->
  <g fill="#6e6a5e" opacity="0.85">
    <path d="M1240 585 c4 -40 7 -62 9 -70 c2 8 5 30 9 70 z"/>
    <path d="M1262 588 c3 -30 5 -46 7 -52 c2 6 4 22 7 52 z"/>
    <path d="M1286 584 c4 -44 7 -66 9 -74 c2 8 5 32 9 74 z"/>
    <path d="M300 572 c3 -32 6 -50 8 -56 c2 6 5 24 8 56 z"/>
  </g>
  <path fill="url(#h3)" d="M0 680 C140 650 260 640 380 650 C520 662 620 690 780 688 C940 686 1060 660 1200 662 C1340 664 1480 690 1600 700 L1600 1000 L0 1000 Z"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
